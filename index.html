
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sichqoncha sarguzashti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>⭐ Sichqoncha sarguzashti ⭐</h1>

        <div class="info">
            <span>⭐ Ball: <b id="score">0</b></span>
            <span>❤️ Jon: <b id="lives">3</b></span>
            <span>🏆 Bosqich: <b id="level">1</b></span>
        </div>

        <div id="game">
            <div id="player">🐭</div>
        </div>

        <div id="message">
            <h2>O‘yinga tayyormisan?</h2>
            <p>Yulduzlarni yig‘ va bombalardan qoch!</p>
            <button id="startBtn">🚀 Boshlash</button>
        </div>

        <p class="instruction">
            🖱 Sichqonchani harakatlantirib o‘yna!
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
